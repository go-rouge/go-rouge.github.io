baseURL = "https://go-rouge.github.io/"
languageCode = "en-us"
title = "go-rouge"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.57:1, bright on the dark background 4.11:1.
  base = "#881337"
  deep = "#530c22"
  bright = "#e11d48"
  shadow = "rgba(136,19,55,.7)"
  glow = "rgba(136,19,55,.6)"
  wash = "rgba(136,19,55,.10)"
  washDeep = "rgba(83,12,34,.06)"
  chipBg = "#fbe4e9"
  chipBorder = "#f6bbc8"
  chipFg = "#530c22"
  chipBgDark = "rgba(225,29,72,.14)"
  chipBorderDark = "rgba(225,29,72,.32)"
  chipFgDark = "#ee839a"
  statsEnd = "#f8c9d3"
  bandText = "#fadbe2"
  accent = "#881337"
  accentDark = "#e5385e"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-rouge.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-rouge"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]
